<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piano Tutor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fde'/%3E%3Crect x='3' y='3' width='2' height='10' fill='white'/%3E%3Crect x='7' y='3' width='2' height='10' fill='white'/%3E%3Crect x='11' y='3' width='2' height='10' fill='white'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('piano-tutor:theme'); } catch (e) {}
      if (t !== 'warm' && t !== 'cold' && t !== 'night') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'warm';
      document.documentElement.dataset.theme = t;
      var v = null, q = null;
      try { v = localStorage.getItem('piano-tutor:view'); q = new URLSearchParams(location.search).get('view'); } catch (e) {}
      document.documentElement.dataset.view = q === 'minimal' || q === 'full' ? q : v === 'minimal' ? 'minimal' : 'full';
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button id="min-pieces" type="button">☰ Pieces</button>
    <h1>Piano Tutor<i class="mark" aria-hidden="true"></i></h1>
    <div class="spacer"></div>
    <span id="app-mode" class="segmented" role="group" aria-label="Free practice or the course">
      <button type="button" data-app="free" title="Browse the library and play whatever you like">Free</button>
      <button type="button" data-app="course" title="Today's session: warm-up, reading, new bars, review">Course</button>
      <button type="button" data-app="piece" title="Learn one piece step by step: notes, each hand, hands together, tempo">Piece</button>
    </span>
    <span class="min-only zoom" role="group" aria-label="Staff size">
      <button id="zoom-out" type="button" aria-label="Smaller staff">A−</button>
      <button id="zoom-in" type="button" aria-label="Bigger staff">A+</button>
    </span>
    <div id="themes" class="themes" role="group" aria-label="Theme"></div>
    <span id="pedal" class="pill" title="Sustain pedal (CC64)" hidden>Pedal <b id="pedal-val">–</b></span>
    <span id="midi-status" class="pill" hidden>MIDI: starting…</span>
    <button id="view-toggle" type="button" title="Switch between the full app and a minimal view for small or e-ink screens">Minimal view</button>
  </header>
  <div id="midi-banner" class="midi-banner" role="alert" hidden>
    <span id="midi-banner-text"></span>
    <button id="midi-banner-retry" type="button">Reconnect</button>
  </div>

  <div class="layout">
    <aside class="library" aria-label="Library">
      <button id="min-close" type="button">Close</button>
      <div class="sr-launch">
        <button id="sr-start" type="button" title="Read pieces you have never seen, from easy to harder, until reading gets difficult">Sight-reading test</button>
        <span id="sr-last" class="muted"></span>
      </div>
      <div class="lib-tools">
        <input id="lib-q" type="search" placeholder="Search title, composer, skill…" aria-label="Search the library" autocomplete="off">
        <div class="lib-row">
          <select id="lib-stage" aria-label="Stage"><option value="all">All stages</option></select>
          <select id="lib-status" aria-label="Status">
            <option value="all">Any status</option><option value="new">New</option><option value="practicing">Practicing</option><option value="done">Done</option>
          </select>
          <select id="lib-hands" aria-label="Hands">
            <option value="all">Any hands</option><option value="both">Both hands</option><option value="rh">Right hand</option><option value="lh">Left hand</option>
          </select>
          <select id="lib-sort" aria-label="Sort">
            <option value="course">Course order</option><option value="difficulty">Easiest first</option><option value="practice">Needs practice first</option><option value="title">A–Z</option>
          </select>
        </div>
        <div class="lib-row">
          <label><input id="lib-pieces" type="checkbox"> Hide scales and arpeggios</label>
          <span id="lib-count" class="hint"></span>
          <button id="lib-clear" type="button">Clear</button>
        </div>
      </div>
      <div id="library"></div>
      <label class="import">
        Open a MusicXML file
        <input id="import" type="file" accept=".musicxml,.xml,.mxl">
      </label>
      <p class="hint">
        No piano? Right hand <kbd>A S D F G H J K L</kbd> (black <kbd>W E T Y U O P</kbd>).
        Left hand <kbd>Z X C V B N M</kbd> (<kbd>Shift</kbd>: lower).
      </p>
    </aside>

    <main>
      <section id="course" class="course" hidden>
        <div id="course-home" class="course-home"></div>
        <div id="course-bar" class="course-bar" hidden></div>
      </section>
      <section class="hero">
        <div class="hero-text">
          <h2 class="piece-title"><span id="piece-title">Pick a piece</span></h2>
          <p id="piece-meta" class="piece-meta"></p>
          <div id="progress" class="progress" hidden></div>
        </div>
        <svg class="blob" viewBox="0 0 420 170" aria-hidden="true" focusable="false">
          <path class="blob-shape" d="M120 0C150 34 96 52 126 88c22 27 74 12 116 30 38 16 54 38 90 52H420V0Z"/>
          <g fill="none" stroke-width="1" stroke-linecap="round">
            <path class="line-a" d="M170 126C230 92 262 140 330 98S396 40 420 52"/>
            <path class="line-b" d="M190 60C240 80 280 30 340 56S400 110 420 96"/>
            <path class="line-c" d="M150 150C220 128 300 160 420 128"/>
          </g>
          <circle class="dot-a" cx="268" cy="88" r="4.5"/>
          <circle class="dot-b" cx="352" cy="32" r="6"/>
          <circle class="dot-c" cx="206" cy="112" r="3"/>
          <rect class="sq-a" x="300" y="64" width="9" height="9" transform="rotate(45 304 68)"/>
          <rect class="sq-b" x="236" y="38" width="8" height="8" transform="rotate(45 240 42)"/>
          <rect class="sq-c" x="378" y="104" width="8" height="8" transform="rotate(45 382 108)"/>
        </svg>
      </section>

      <div class="controls transport">
        <div class="segmented" id="mode" role="group" aria-label="Mode">
          <button type="button" data-mode="wait" title="The score waits for you">Wait</button>
          <button type="button" data-mode="tempo" title="The score keeps time; you play in time">Tempo</button>
        </div>
        <div class="segmented" id="hands" role="group" aria-label="Hands">
          <button type="button" data-hands="rh">Right</button>
          <button type="button" data-hands="lh">Left</button>
          <button type="button" data-hands="both">Both</button>
        </div>
        <div class="spacer"></div>
        <button id="voice" type="button" title="The sound of Listen and the computer keyboard: tap to change"></button>
        <button id="listen" type="button" title="Hear the piece at the tempo below, with the cursor following">▶ Listen</button>
        <button id="restart" type="button" class="primary">Restart</button>
        <span id="line-sync" class="line-sync" role="group" aria-label="Where the line is drawn" hidden>
          <span class="muted">Line</span>
          <button id="line-earlier" type="button" title="The line reaches the note too late: draw it earlier">Earlier</button>
          <button id="line-later" type="button" title="The line reaches the note too early: draw it later">Later</button>
          <span id="line-lag" class="muted"></span>
        </span>
        <button id="stop" type="button" class="stop" hidden>Stop</button>
      </div>

      <section id="pace-controls" class="controls panel pace">
        <div class="group dial">
          <div class="cap"><span>Tempo</span></div>
          <div class="dial-row">
            <button id="bpm-dec" type="button" class="round" aria-label="Slower">−</button>
            <div class="bpm-stack">
              <input id="bpm" type="number" min="30" max="160" step="2" value="60" aria-label="Tempo">
              <span id="bpm-unit">bpm</span>
            </div>
            <button id="bpm-inc" type="button" class="round" aria-label="Faster">+</button>
          </div>
          <div class="ruler" aria-hidden="true"><i class="fill"></i><i class="notch"></i></div>
          <div class="ruler-labels"><span id="bpm-min">30</span><span id="target" class="muted"></span><span id="bpm-max">160</span></div>
          <span id="beat-hint" class="muted"></span>
        </div>
        <div class="group opts">
          <div class="cap"><span>Practise</span></div>
          <span class="range" title="Practise just some bars: the cursor, wait mode, tempo mode and Listen all follow it">
            Bars <input id="bar-from" type="number" min="1" value="1" aria-label="First bar"> to
            <input id="bar-to" type="number" min="1" value="1" aria-label="Last bar"> of <span id="bar-total">–</span>
            <button id="bar-all" type="button">Whole piece</button>
          </span>
          <label title="Play it again straight away, over and over, until you press Stop (or Escape)"><input id="loop" type="checkbox"> Loop</label>
          <label><input id="listen-clicks" type="checkbox" checked> Clicks while listening</label>
        </div>
      </section>

      <section id="tempo-controls" class="controls panel tempo-controls" hidden>
        <div class="group">
          <div class="cap"><span>Timing</span></div>
          <div class="row">
            <div class="segmented" id="level" role="group" aria-label="Timing strictness" title="How exactly in time a note must be">
              <button type="button" data-level="beginner" title="Wide window: about half a beat either side">Beginner</button>
              <button type="button" data-level="intermediate" title="Medium window">Intermediate</button>
              <button type="button" data-level="advanced" title="Strict: a small window around the beat">Advanced</button>
            </div>
            <label><input id="metronome" type="checkbox" checked> Metronome while playing</label>
            <label><input id="backing" type="checkbox" checked> Play the music quietly</label>
            <label><input id="showNext" type="checkbox" checked> Show the next key</label>
            <span class="calib">
              <button id="calibrate" type="button" title="Tap along with 16 clicks to measure the delay of your speakers and piano">Calibrate timing</button>
              <button id="calib-reset" type="button" hidden>Reset</button>
              <span id="latency" class="muted"></span>
            </span>
          </div>
        </div>
      </section>

      <div id="sr-panel" class="sr-panel" hidden>
        <div id="sr-text"></div>
        <div class="sr-buttons">
          <button id="sr-next" type="button" hidden>Next piece</button>
          <button id="sr-quit" type="button">End test</button>
        </div>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div id="result" class="result" hidden></div>
      <div id="score"></div>
      <div id="keyboard"></div>
    </main>
  </div>
</div>
</body>
</html>
